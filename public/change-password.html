<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Change password</h2>
    <p class="subtitle">Enter your current and new password</p>
    <div id="message" class="message" role="alert"></div>

    <form id="changePasswordForm" novalidate>
      <label for="currentPassword">Current password</label>
      <input type="password" id="currentPassword" placeholder="Current Password" autocomplete="current-password" required>

      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" placeholder="New Password (min 6 characters)" autocomplete="new-password" required>

      <label for="confirmNewPassword">Confirm new password</label>
      <input type="password" id="confirmNewPassword" placeholder="Confirm Password" autocomplete="new-password" required>

      <div class="button-group">
        <button type="submit" class="btn-login" id="changePasswordBtn">Update Password</button>
        <a href="/dashboard.html" class="btn btn-link">Back to dashboard</a>
      </div>
    </form>
  </div>
  <script src="/app.js"></script>
  <script>App.initChangePasswordPage();</script>
</body>
</html>

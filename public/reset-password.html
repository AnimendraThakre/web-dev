<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Reset password</h2>
    <p class="subtitle">Use the 6-digit code sent to your email</p>
    <div id="message" class="message" role="alert"></div>

    <form id="resetPasswordForm" novalidate>
      <label for="resetEmail">Email</label>
      <input type="email" id="resetEmail" placeholder="Email ID" autocomplete="email" required>

      <label for="resetCode">Reset code</label>
      <input type="text" id="resetCode" class="otp-input" placeholder="000000" inputmode="numeric" maxlength="6" required>

      <label for="resetNewPassword">New password</label>
      <input type="password" id="resetNewPassword" placeholder="New Password (min 6 characters)" autocomplete="new-password" required>

      <label for="resetConfirmPassword">Confirm new password</label>
      <input type="password" id="resetConfirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>

      <div class="button-group">
        <button type="submit" class="btn-login" id="resetPasswordBtn">Reset Password</button>
        <a href="/login.html" class="btn btn-link">Back to login</a>
      </div>
    </form>
  </div>
  <script src="/app.js"></script>
  <script>App.initResetPasswordPage();</script>
</body>
</html>

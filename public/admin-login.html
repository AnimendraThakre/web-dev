<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-container admin-theme">
    <div class="mfa-icon" aria-hidden="true">🛡️</div>
    <h2>Admin Login</h2>
    <p class="subtitle">Secure admin access with Google Authenticator MFA</p>

    <div id="message" class="message" role="alert"></div>

    <form id="adminLoginForm" novalidate>
      <label for="adminEmail">Admin email</label>
      <input type="email" id="adminEmail" placeholder="Admin email" autocomplete="email" required>

      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" required>

      <div class="button-group">
        <button type="submit" class="btn-login" id="adminLoginBtn">Admin Login</button>
        <a href="/login.html" class="btn btn-link">User login</a>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
  <script>App.initAdminLoginPage();</script>
</body>
</html>

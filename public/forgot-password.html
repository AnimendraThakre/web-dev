<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Forgot password</h2>
    <p class="subtitle">Enter your email to receive a reset code</p>
    <div id="message" class="message" role="alert"></div>

    <form id="forgotPasswordForm" novalidate>
      <label for="forgotEmail">Email</label>
      <input type="email" id="forgotEmail" placeholder="Email ID" autocomplete="email" required>
      <div class="button-group">
        <button type="submit" class="btn-login" id="forgotPasswordBtn">Send Reset Code</button>
        <a href="/login.html" class="btn btn-link">Back to login</a>
      </div>
    </form>
  </div>
  <script src="/app.js"></script>
  <script>App.initForgotPasswordPage();</script>
</body>
</html>
